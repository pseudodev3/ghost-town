<head>

    <!-- Styles and JS are bundled by Vite -->
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --font-primary: 'Space Grotesk', 'Courier New', monospace;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }
        
        html, body {
            min-height: 100%;
            font-family: var(--font-primary);
        }
        
        body {
            background: transparent;
            color: #fff;
            position: relative;
            image-rendering: pixelated;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* Tree background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('/assets/tree.webp');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            z-index: -2;
        }
        
        /* CRT scanline effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            ),
            linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 9999;
        }
        
        .pixelblog-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .pixelblog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 30px;
            background: transparent;
        }
        
        .pixelblog-header h1 {
            color: #ff00ff;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 
                3px 3px 0 #00ffff,
                6px 6px 0 rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }
        
        .back-btn {
            color: #00ffff;
            text-decoration: none;
            font-size: 0.8rem;
            border: 2px solid #00ffff;
            padding: 8px 16px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 2px 2px 0 rgba(0, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }
        
        .back-btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 4px 4px 0 rgba(0, 255, 255, 0.5);
        }
        
        #full-pixel-blog {
            min-height: 600px;
            position: relative;
        }
    </style>
  <script type="module" crossorigin src="/assets/modulepreload-polyfill-YP0FEG5d.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/styles-CeRdMI9B.css">
</head>
<body>
    <div class="pixelblog-header">
        <h1>PIXEL BLOG</h1>
        <a href="/" class="back-btn">← BACK</a>
    </div>
    <div class="pixelblog-content">
        <div id="full-pixel-blog"></div>
    </div>

    <script src="/pixel-blog.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            
            // Fetch posts from API
            async function fetchPosts() {
                try {
                    const response = await fetch('/api/posts');
                    if (!response.ok) throw new Error('Failed to fetch');
                    return await response.json();
                } catch (err) {
                    console.error('[Blog] API error:', err);
                    return null;
                }
            }
            
            function injectStyles() {
                const container = document.querySelector('#full-pixel-blog');
                if (!container || !container.shadowRoot) return false;
                
                const existing = container.shadowRoot.querySelector('#blog-styles');
                if (existing) existing.remove();
                
                const style = document.createElement('style');
                style.id = 'blog-styles';
                style.textContent = `
                    :host, #pixel-blog-root { background: transparent !important; }
                    .pixel-blog-wrapper { background: transparent !important; }
                    
                    .pixel-border {
                        background: rgba(20, 20, 35, 0.9) !important;
                        border: 2px solid rgba(0, 255, 255, 0.5) !important;
                        margin-bottom: 1.5rem !important;
                        padding: 1.5rem !important;
                    }
                    
                    .pixel-border:hover {
                        background: rgba(30, 30, 50, 0.95) !important;
                        border-color: rgba(255, 0, 255, 0.6) !important;
                    }
                    
                    p { color: #fff !important; text-shadow: 0 1px 2px #000 !important; }
                    h3 { color: #ff00ff !important; text-shadow: 1px 1px 0 #000 !important; }
                    span { text-shadow: 0 1px 1px #000 !important; }
                    
                    .pixel-button {
                        background: rgba(0, 255, 255, 0.2) !important;
                        border: 2px solid rgba(0, 255, 255, 0.5) !important;
                        color: #00ffff !important;
                        padding: 8px 16px !important;
                    }
                `;
                container.shadowRoot.appendChild(style);
                return true;
            }
            
            // Get posts from API or fallback
            const posts = await fetchPosts();
            
            if (typeof PixelBlog !== 'undefined') {
                PixelBlog.mount({
                    container: '#full-pixel-blog',
                    adminPassword: 'ghost-town-1337',
                    storageKey: 'ghost_town_blog',
                    enableAdmin: true,
                    fullPage: true,
                    posts: posts || [
                        {
                            id: 1,
                            title: "La Vague Streetwear",
                            date: "2026-02-19",
                            category: "Project",
                            excerpt: "Finished building the digital storefront for La Vague. Deep dives into texture, minimalism, and flow.",
                            content: "Finished building the digital storefront for La Vague. Deep dives into texture, minimalism, and flow."
                        },
                        {
                            id: 2,
                            title: "Building GHOST",
                            date: "2026-02-05",
                            category: "AI",
                            excerpt: "Created a personal AI that lives on my laptop. It sees, it remembers, it helps.",
                            content: "Created a personal AI that lives on my laptop. It sees, it remembers, it helps."
                        },
                        {
                            id: 3,
                            title: "The 2030 Deadline",
                            date: "2026-01-20",
                            category: "Goals",
                            excerpt: "Setting impossible goals and chasing them. Superhero status or bust.",
                            content: "Setting impossible goals and chasing them. Superhero status or bust."
                        },
                        {
                            id: 4,
                            title: "Ghost Town Goes Live",
                            date: "2025-12-15",
                            category: "Launch",
                            excerpt: "Finally launched my personal site. CRT effects, ghost pets, and all.",
                            content: "Finally launched my personal site. CRT effects, ghost pets, and all."
                        }
                    ]
                });
                
                setTimeout(function tryInject() {
                    if (!injectStyles()) {
                        setTimeout(tryInject, 100);
                    }
                }, 50);
                
                setInterval(injectStyles, 500);
            }
        });
    </script>
</body>
</html>
