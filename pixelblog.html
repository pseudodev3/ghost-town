<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Blog</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='16' y1='2' x2='16' y2='28' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%23151520'/%3E%3Cstop offset='50%25' stop-color='%230a0a10'/%3E%3Cstop offset='100%25' stop-color='%23050505'/%3E%3C/linearGradient%3E%3Cfilter id='s' x='-20%25' y='-20%25' width='140%25' height='140%25'%3E%3CfeDropShadow dx='0' dy='1' stdDeviation='1.5' flood-color='%23a0c4ff' flood-opacity='0.5'/%3E%3C/filter%3E%3ClinearGradient id='e' x1='12' y1='12' x2='12' y2='18' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%23c4d8ff'/%3E%3Cstop offset='100%25' stop-color='%23a0c4ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 2C9 2 4 8 4 15V28L10 24L16 28L22 24L28 28V15C28 8 23 2 16 2Z' fill='url(%23g)' filter='url(%23s)'/%3E%3Cpath d='M16 3.5C10 3.5 5.5 8.5 5.5 15V26.2L10.5 22.7L16 26.2L21.5 22.7L26.5 26.2V15C26.5 8.5 22 3.5 16 3.5Z' stroke='%23a0c4ff' stroke-width='1.5' stroke-linejoin='round' opacity='0.95'/%3E%3Cpath d='M10 13L14 15L10 17V13Z' fill='url(%23e)'/%3E%3Cpath d='M22 13L18 15L22 17V13Z' fill='url(%23e)'/%3E%3Cellipse cx='16' cy='7' rx='4' ry='2' fill='%23a0c4ff' opacity='0.12'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            min-height: 100%;
        }
        
        body {
            background: transparent;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            position: relative;
            image-rendering: pixelated;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* Tree background - covers full page */
        html {
            height: 100%;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            min-height: 100%;
            background: url('/assets/tree.webp');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            z-index: -2;
        }
        
        /* CRT scanline effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            ),
            linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 9999;
        }
        
        /* Main content container */
        .pixelblog-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Header styling */
        .pixelblog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 30px;
            background: transparent;
        }
        
        .pixelblog-header h1 {
            color: #ff00ff;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 
                3px 3px 0 #00ffff,
                6px 6px 0 rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }
        
        .back-btn {
            color: #00ffff;
            text-decoration: none;
            font-size: 0.8rem;
            border: 2px solid #00ffff;
            padding: 8px 16px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 2px 2px 0 rgba(0, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }
        
        .back-btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 4px 4px 0 rgba(0, 255, 255, 0.5);
        }
        
        /* Blog window container with tree background */
        #full-pixel-blog {
            min-height: 600px;
            position: relative;
        }
        
        /* The blog window itself - uses tree as background */
        #full-pixel-blog > div {
            background: transparent !important;
        }
        
        /* Shadow DOM overrides for better visibility */
        :host(.pixel-border) {
            background: transparent !important;
        }
        
        /* Blog container styles that will be injected into shadow DOM */
        .pixel-blog-glass {
            background: rgba(10, 10, 20, 0.85) !important;
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 2px solid rgba(255, 0, 255, 0.5) !important;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
        }
        
        .pixel-blog-card {
            background: rgba(20, 20, 35, 0.9) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(0, 255, 255, 0.4) !important;
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
            transition: all 0.2s ease;
        }
        
        .pixel-blog-card:hover {
            background: rgba(30, 30, 50, 0.95) !important;
            border-color: rgba(255, 0, 255, 0.6) !important;
            box-shadow: 
                0 6px 30px rgba(255, 0, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
            transform: translateY(-2px);
        }
        
        /* Text readability improvements */
        .pixel-blog-text {
            color: #e0e0e0 !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8) !important;
        }
        
        .pixel-blog-title {
            color: #ff00ff !important;
            text-shadow: 
                2px 2px 0 rgba(0, 255, 255, 0.3),
                0 0 20px rgba(255, 0, 255, 0.3) !important;
        }
        
        .pixel-blog-category {
            color: #ffff00 !important;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.4) !important;
        }
        
        .pixel-blog-date {
            color: #00ffff !important;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3) !important;
        }
    </style>
</head>
<body>
    <div class="pixelblog-header">
        <h1>PIXEL BLOG</h1>
        <a href="/" class="back-btn">← BACK</a>
    </div>
    <div class="pixelblog-content">
        <div id="full-pixel-blog"></div>
    </div>

    <script src="/pixel-blog.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Function to inject enhanced styles into shadow DOM
            function injectEnhancedStyles() {
                const blogContainer = document.querySelector('#full-pixel-blog');
                if (blogContainer && blogContainer.shadowRoot) {
                    // Check if styles already injected
                    if (blogContainer.shadowRoot.querySelector('#enhanced-styles')) {
                        return true;
                    }
                    
                    const styleEl = document.createElement('style');
                    styleEl.id = 'enhanced-styles';
                    styleEl.textContent = `
                        /* Root container with tree background visible */
                        :host { 
                            background: transparent !important;
                            display: block;
                        }
                        
                        #pixel-blog-root { 
                            background: transparent !important;
                            min-height: 100%;
                            padding: 0;
                        }
                        
                        /* Main blog container - Darker for better text contrast */
                        .pixel-border, [class*="border"] {
                            background: rgba(5, 5, 15, 0.95) !important;
                            backdrop-filter: blur(24px) saturate(200%) !important;
                            -webkit-backdrop-filter: blur(24px) saturate(200%) !important;
                            border: 2px solid rgba(255, 0, 255, 0.5) !important;
                            box-shadow: 
                                0 12px 40px rgba(0, 0, 0, 0.6),
                                inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
                            border-radius: 4px !important;
                        }
                        
                        /* Blog cards - SOLID dark background for text readability */
                        div[class*="border"] > div,
                        [style*="border"] {
                            background: rgba(10, 10, 25, 0.98) !important;
                            backdrop-filter: blur(20px) !important;
                            -webkit-backdrop-filter: blur(20px) !important;
                            border: 2px solid rgba(0, 255, 255, 0.4) !important;
                            box-shadow: 
                                0 6px 24px rgba(0, 0, 0, 0.5),
                                inset 0 1px 0 rgba(255, 255, 255, 0.03) !important;
                            transition: all 0.2s ease !important;
                            padding: 1.5rem !important;
                        }
                        
                        /* Card hover effect */
                        div[class*="border"] > div:hover,
                        [style*="border"]:hover {
                            background: rgba(15, 15, 35, 0.99) !important;
                            border-color: rgba(255, 0, 255, 0.6) !important;
                            box-shadow: 
                                0 8px 32px rgba(255, 0, 255, 0.2),
                                inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
                            transform: translateY(-2px);
                        }
                        
                        /* ===== OVERRIDE ALL INLINE STYLES ===== */
                        
                        /* Target elements by their inline style color values */
                        [style*="color: #aaa"],
                        [style*="color:#aaa"] {
                            color: #ffffff !important;
                            text-shadow: 0 2px 4px rgba(0, 0, 0, 1) !important;
                        }
                        
                        [style*="color: #666"],
                        [style*="color:#666"] {
                            color: #ff8888 !important;
                            text-shadow: 0 1px 3px rgba(0, 0, 0, 1) !important;
                        }
                        
                        [style*="color: #ff00ff"],
                        [style*="color:#ff00ff"] {
                            color: #ff40ff !important;
                            text-shadow: 
                                2px 2px 0 #000,
                                -1px -1px 0 #000,
                                1px -1px 0 #000,
                                -1px 1px 0 #000,
                                1px 1px 0 #000,
                                0 0 15px rgba(255, 0, 255, 0.7) !important;
                        }
                        
                        [style*="color: #ffff00"],
                        [style*="color:#ffff00"] {
                            color: #ffff00 !important;
                            text-shadow: 
                                0 0 0 #000,
                                -1px -1px 0 #000,
                                1px -1px 0 #000,
                                -1px 1px 0 #000,
                                1px 1px 0 #000,
                                0 0 10px rgba(255, 255, 0, 0.6) !important;
                            font-weight: 700 !important;
                        }
                        
                        [style*="color: #00ffff"],
                        [style*="color:#00ffff"] {
                            color: #00ffff !important;
                            text-shadow: 
                                0 0 0 #000,
                                -1px -1px 0 #000,
                                1px -1px 0 #000,
                                -1px 1px 0 #000,
                                1px 1px 0 #000,
                                0 0 10px rgba(0, 255, 255, 0.5) !important;
                            font-weight: 600 !important;
                        }
                        
                        /* All text - FORCE WHITE with strong shadow */
                        *, *::before, *::after {
                            color: #ffffff !important;
                            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9) !important;
                        }
                        
                        /* Paragraphs - Force readable */
                        p, p *, p::before, p::after {
                            color: #ffffff !important;
                            font-size: 0.9rem !important;
                            line-height: 1.7 !important;
                            text-shadow: 
                                0 1px 3px rgba(0, 0, 0, 1),
                                0 2px 6px rgba(0, 0, 0, 0.9) !important;
                        }
                        
                        /* Spans (category, date) */
                        span, span *, span::before, span::after {
                            text-shadow: 
                                0 0 0 #000,
                                -1px -1px 0 #000,
                                1px -1px 0 #000,
                                -1px 1px 0 #000,
                                1px 1px 0 #000 !important;
                            font-weight: 600 !important;
                        }
                        
                        /* Headings */
                        h1, h2, h3, h4, h5, h6,
                        h1 *, h2 *, h3 *, h4 *, h5 *, h6 * {
                            color: #ff40ff !important;
                            text-shadow: 
                                2px 2px 0 #000,
                                -1px -1px 0 #000,
                                1px -1px 0 #000,
                                -1px 1px 0 #000,
                                1px 1px 0 #000,
                                0 0 20px rgba(255, 0, 255, 0.6) !important;
                            font-weight: 800 !important;
                        }
                        
                        /* SVG icons */
                        svg, svg * {
                            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.9)) !important;
                        }
                        
                        /* Buttons */
                        button, [role="button"],
                        button *, [role="button"] * {
                            background: rgba(0, 255, 255, 0.25) !important;
                            border: 2px solid rgba(0, 255, 255, 0.7) !important;
                            color: #00ffff !important;
                            text-shadow: 
                                -1px -1px 0 #000,
                                1px -1px 0 #000,
                                -1px 1px 0 #000,
                                1px 1px 0 #000,
                                0 0 12px rgba(0, 255, 255, 0.7) !important;
                            font-weight: 700 !important;
                        }
                        
                        button:hover, [role="button"]:hover {
                            background: rgba(0, 255, 255, 0.4) !important;
                            color: #ffffff !important;
                        }
                        
                        /* Inputs */
                        input, textarea,
                        input *, textarea * {
                            background: rgba(0, 0, 0, 0.8) !important;
                            border: 2px solid rgba(255, 0, 255, 0.6) !important;
                            color: #ffffff !important;
                            text-shadow: 0 1px 2px rgba(0, 0, 0, 1) !important;
                        }
                        
                        /* Links */
                        a, a * {
                            color: #00ffff !important;
                            text-shadow: 
                                -1px -1px 0 #000,
                                1px -1px 0 #000,
                                -1px 1px 0 #000,
                                1px 1px 0 #000,
                                0 0 10px rgba(0, 255, 255, 0.5) !important;
                            font-weight: 600 !important;
                        }
                        
                        a:hover, a:hover * {
                            color: #ff00ff !important;
                            text-shadow: 
                                -1px -1px 0 #000,
                                1px -1px 0 #000,
                                -1px 1px 0 #000,
                                1px 1px 0 #000,
                                0 0 15px rgba(255, 0, 255, 0.6) !important;
                        }
                        
                        /* Scrollbar */
                        ::-webkit-scrollbar {
                            width: 10px;
                        }
                        
                        ::-webkit-scrollbar-track {
                            background: rgba(0, 0, 0, 0.5);
                        }
                        
                        ::-webkit-scrollbar-thumb {
                            background: rgba(255, 0, 255, 0.6);
                            border-radius: 5px;
                        }
                        
                        ::-webkit-scrollbar-thumb:hover {
                            background: rgba(255, 0, 255, 0.8);
                        }
                    `;
                    blogContainer.shadowRoot.appendChild(styleEl);
                    
                    // Also forcefully override inline styles with JavaScript
                    fixTextStyles(blogContainer.shadowRoot);
                    
                    return true;
                }
                return false;
            }
            
            // Function to directly fix inline styles on elements
            function fixTextStyles(root) {
                if (!root) return;
                
                // Fix all paragraphs (excerpt text)
                const paragraphs = root.querySelectorAll('p');
                paragraphs.forEach(p => {
                    p.style.setProperty('color', '#ffffff', 'important');
                    p.style.setProperty('text-shadow', '0 2px 4px rgba(0,0,0,0.9)', 'important');
                    p.style.setProperty('font-weight', '500', 'important');
                });
                
                // Fix spans (category, date, encrypted text)
                const spans = root.querySelectorAll('span');
                spans.forEach(span => {
                    const text = span.textContent.toLowerCase();
                    if (text.includes('encrypted') || text.includes('unlocked')) {
                        span.style.setProperty('color', '#ff8888', 'important');
                    } else if (span.style.color === 'rgb(170, 170, 170)' || span.style.color === '#aaa') {
                        span.style.setProperty('color', '#ffffff', 'important');
                    }
                    span.style.setProperty('text-shadow', '0 1px 3px rgba(0,0,0,1)', 'important');
                    span.style.setProperty('font-weight', '600', 'important');
                });
                
                // Fix divs with inline styles
                const divs = root.querySelectorAll('div');
                divs.forEach(div => {
                    if (div.style.color === 'rgb(102, 102, 102)' || div.style.color === '#666') {
                        div.style.setProperty('color', '#ff8888', 'important');
                    }
                });
                
                // Fix headings
                const headings = root.querySelectorAll('h1, h2, h3, h4, h5, h6');
                headings.forEach(h => {
                    h.style.setProperty('text-shadow', '2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 15px rgba(255,0,255,0.6)', 'important');
                });
            }
            
            if (typeof PixelBlog !== 'undefined') {
                PixelBlog.mount({
                    container: '#full-pixel-blog',
                    adminPassword: 'ghost-town-1337',
                    storageKey: 'ghost_town_blog',
                    enableAdmin: true,
                    fullPage: true,
                    posts: [
                        {
                            id: 1,
                            title: "La Vague Streetwear",
                            date: "2026-02-19",
                            category: "Project",
                            excerpt: "Finished building the digital storefront for La Vague. Deep dives into texture, minimalism, and flow.",
                            content: "Finished building the digital storefront for La Vague. Deep dives into texture, minimalism, and flow. The project involved creating a unique e-commerce experience that captures the essence of streetwear culture while maintaining a clean, minimalist aesthetic. Every detail was crafted to reflect the brand's identity."
                        },
                        {
                            id: 2,
                            title: "Building GHOST",
                            date: "2026-02-05",
                            category: "AI",
                            excerpt: "Created a personal AI that lives on my laptop. It sees, it remembers, it helps.",
                            content: "Created a personal AI that lives on my laptop. It sees, it remembers, it helps. This has been a fascinating journey into local LLMs and computer vision. The ghost watches, learns, and assists in ways I never imagined possible. It's like having a digital companion that actually understands context."
                        },
                        {
                            id: 3,
                            title: "The 2030 Deadline",
                            date: "2026-01-20",
                            category: "Goals",
                            excerpt: "Setting impossible goals and chasing them. Superhero status or bust.",
                            content: "Setting impossible goals and chasing them. Superhero status or bust. By 2030, I aim to reach a level of mastery in my craft that rivals the heroes I look up to. Every day is a step toward that impossible goal. The journey is chaotic, but the direction is clear."
                        },
                        {
                            id: 4,
                            title: "Ghost Town Goes Live",
                            date: "2025-12-15",
                            category: "Launch",
                            excerpt: "Finally launched my personal site. CRT effects, ghost pets, and all.",
                            content: "Finally launched my personal site. CRT effects, ghost pets, and all. This has been a labor of love - combining retro aesthetics with modern web tech. The ghost town is now open for visitors. The CRT overlay, the flickering lights, the ambient music - everything came together to create this digital haunt."
                        }
                    ]
                });
                
                // Inject enhanced styles into shadow DOM after mount
                setTimeout(function tryInject() {
                    if (!injectEnhancedStyles()) {
                        // Retry if shadow DOM not ready yet
                        setTimeout(tryInject, 100);
                    } else {
                        // Also apply JS fixes after styles are injected
                        const blogContainer = document.querySelector('#full-pixel-blog');
                        if (blogContainer && blogContainer.shadowRoot) {
                            fixTextStyles(blogContainer.shadowRoot);
                            // Re-apply periodically to catch dynamically added content
                            setInterval(() => fixTextStyles(blogContainer.shadowRoot), 500);
                        }
                    }
                }, 100);
                
                // Also set up observer for dynamic content
                const observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.addedNodes.length > 0) {
                            injectEnhancedStyles();
                        }
                    });
                });
                
                const blogContainer = document.querySelector('#full-pixel-blog');
                if (blogContainer) {
                    observer.observe(blogContainer, { childList: true, subtree: true });
                }
                
                // Periodic re-injection to ensure styles persist
                setInterval(injectEnhancedStyles, 1000);
            }
        });
    </script>
</body>
</html>
