    <!-- Bundle shared styles -->
    <script type="module">
      import './style.css';
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: transparent;
            font-family: 'Space Grotesk', 'Courier New', monospace;
        }
        
        .ticker-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            background: rgba(15, 15, 25, 0.95);
            border-top: 1px solid rgba(160, 196, 255, 0.15);
            border-bottom: 1px solid rgba(160, 196, 255, 0.1);
            position: relative;
        }
        
        /* Corner accents */
        .ticker-container::before,
        .ticker-container::after {
            content: '';
            position: absolute;
            top: 0;
            width: 40px;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        
        .ticker-container::before {
            left: 0;
            background: linear-gradient(90deg, rgba(10,10,20,1), transparent);
        }
        
        .ticker-container::after {
            right: 0;
            background: linear-gradient(270deg, rgba(10,10,20,1), transparent);
        }
        
        .ticker-wrap {
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            white-space: nowrap;
            display: flex; 
            align-items: center;
            mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
        }

        .ticker { 
            display: flex; 
            align-items: center;
            width: max-content; 
            animation: marquee 20s linear infinite; 
            will-change: transform;
            padding: 8px 0;
        }
        
        /* Label styling */
        .label {
            font-size: 11px; 
            font-weight: 700;
            color: #a0c4ff;
            margin-right: 20px;
            margin-left: 30px;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .label::before {
            content: '◆';
            color: #7a9bc4;
            font-size: 8px;
        }
        
        /* Item styling */
        .item {
            font-size: 12px; 
            font-weight: 500;
            color: #c0c0d0;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            margin: 0 12px;
            white-space: nowrap;
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .item:hover { 
            color: #ffffff;
            background: rgba(160, 196, 255, 0.08);
            transform: translateY(-1px);
        }
        
        /* Project icons */
        .item::before {
            content: '›';
            color: #7a9bc4;
            font-size: 14px;
            opacity: 0.7;
            transition: all 0.3s ease;
        }
        
        .item:hover::before {
            opacity: 1;
            color: #a0c4ff;
        }

        /* Separator */
        .separator { 
            color: rgba(160, 196, 255, 0.4);
            margin-left: 8px;
            font-weight: 400;
            font-size: 10px;
            opacity: 0.6;
        }
        
        /* Tech badges */
        .tech-badge {
            font-size: 9px;
            padding: 2px 6px;
            background: rgba(160, 196, 255, 0.1);
            border: 1px solid rgba(160, 196, 255, 0.3);
            border-radius: 3px;
            color: #a0c4ff;
            margin-left: 8px;
            letter-spacing: 0.5px;
        }
        
        /* Animation */
        @keyframes marquee { 
            0% { transform: translateX(0); } 
            100% { transform: translateX(-50%); } 
        }
        
        /* Pause on hover */
        .ticker-wrap:hover .ticker { 
            animation-play-state: paused; 
        }
        
        /* Blinking cursor effect */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: #7a9bc4;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="ticker-container">
        <div class="ticker-wrap">
            <div class="ticker">

                <a href="#" class="item" target="_blank">Wormhole-P2P <span class="tech-badge">NODE</span><span class="separator">//</span></a>

                <a href="#" class="item" target="_blank">Neural-Hunt <span class="tech-badge">PYTHON</span><span class="separator">//</span></a>

                <span class="label">PROJECTS<span class="cursor"></span></span>
                <a href="#" class="item" target="_blank">Sentry-AI <span class="tech-badge">PYTHON</span><span class="separator">//</span></a>
                <a href="#" class="item" target="_blank">Wormhole-P2P <span class="tech-badge">NODE</span><span class="separator">//</span></a>
                <a href="#" class="item" target="_blank">Ghost-Shell <span class="tech-badge">HTML/JS</span><span class="separator">//</span></a>
                <a href="#" class="item" target="_blank">Neural-Hunt <span class="tech-badge">PYTHON</span><span class="separator">//</span></a>
                <a href="#" class="item" target="_blank" style="margin-right: 50px;">Lazor-Kit <span class="tech-badge">REACT</span><span class="separator">//</span></a>

            </div>
        </div>
    </div>
</body>
